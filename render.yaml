services:
  - type: web
    name: algorithmic-tutor-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: corepack enable && pnpm install --frozen-lockfile=false && pnpm build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: CORS_ORIGIN
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: APP_MODE
        value: cloud
      - key: OPENAI_API_KEY
        sync: false
