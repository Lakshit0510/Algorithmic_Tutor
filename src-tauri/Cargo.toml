[package]
name = "algorithmic-tutor"
version = "0.1.0"
description = "A complexity-aware Codeforces mentor"
authors = ["Algorithmic Tutor"]
edition = "2021"

[lib]
name = "algorithmic_tutor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "algorithmic-tutor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = [] }
tauri-plugin-shell = "2.2.0"
keyring = "3.6.2"
rand = "0.8.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12.1", features = ["json"] }
